# Configuración del bot de mercado.
# Todo lo que sigue se puede editar sin tocar el código.

# Umbrales de señales
signals:
  min_move_pct: 4.0          # movimiento diario mínimo (en %) para considerarlo "grande"
  z_threshold: 2.5           # o 2.5 veces la volatilidad diaria de los últimos 20 días
  min_move_pct_by_group:     # umbrales propios según el grupo
    "Materias primas": 2.5
    "Argentina": 5.0
    "Brasil": 4.0
  rsi_oversold: 30           # RSI(14) en o debajo de este valor = sobrevendido
  near_52w_low_pct: 5.0      # a menos de 5% del mínimo de 52 semanas
  min_drawdown_pct: 20.0     # y al menos 20% por debajo del máximo de 52 semanas
  max_movers: 3              # máximo de movimientos grandes (primero los que tienen CEDEAR)
  max_opportunities: 3       # máximo de "a revisar" en el informe
  min_market_cap_usd_bn: 100 # capitalización mínima del S&P 500, en miles de millones de dólares
  max_news_symbols: 8        # activos para los que se buscan noticias y contexto

# Panorama general (solo se muestra la variación del día)
panorama:
  - {symbol: "^GSPC", label: "S&P 500"}
  - {symbol: "^BVSP", label: "Bovespa"}
  - {symbol: "GC=F", label: "Oro"}
  - {symbol: "CL=F", label: "Petróleo WTI"}
  - {symbol: "URA", label: "Uranio (ETF URA)"}

# Análisis de mercado: sectores contra el índice y posibles rotaciones.
# Una rotación se marca si un activo del par sube, el otro baja y la brecha del día
# supera tanto rotation_min_gap_pct como rotation_z veces la brecha habitual (20 días).
market_analysis:
  benchmark: SPY
  rotation_min_gap_pct: 1.5
  rotation_z: 2.0
  sectors:
    - {symbol: SMH, label: "Semiconductores"}
    - {symbol: IGV, label: "Software/SaaS"}
    - {symbol: XLK, label: "Tecnología"}
    - {symbol: XLC, label: "Comunicaciones"}
    - {symbol: XLY, label: "Consumo discrecional"}
    - {symbol: XLP, label: "Consumo básico"}
    - {symbol: XLF, label: "Financieras"}
    - {symbol: XLV, label: "Salud"}
    - {symbol: XLE, label: "Energía"}
    - {symbol: XLI, label: "Industriales"}
    - {symbol: XLB, label: "Materiales"}
    - {symbol: XLU, label: "Servicios públicos"}
    - {symbol: XLRE, label: "Inmobiliario"}
  styles:
    - {symbol: VUG, label: "Crecimiento"}
    - {symbol: VTV, label: "Valor"}
    - {symbol: SPY, label: "Grandes empresas"}
    - {symbol: IWM, label: "Pequeñas empresas"}
  # Con qué ETF se compara cada empresa, según la clasificación de Yahoo.
  # La industria tiene prioridad sobre el sector.
  industry_map:
    "Semiconductors": SMH
    "Semiconductor Equipment & Materials": SMH
    "Software - Application": IGV
    "Software - Infrastructure": IGV
  sector_map:
    "Technology": XLK
    "Communication Services": XLC
    "Consumer Cyclical": XLY
    "Consumer Defensive": XLP
    "Financial Services": XLF
    "Healthcare": XLV
    "Energy": XLE
    "Industrials": XLI
    "Basic Materials": XLB
    "Utilities": XLU
    "Real Estate": XLRE
  rotation_pairs:
    - [SMH, IGV]    # semiconductores / software
    - [VUG, VTV]    # crecimiento / valor
    - [XLY, XLP]    # consumo discrecional / básico
    - [XLK, XLF]    # tecnología / financieras
    - [XLK, XLE]    # tecnología / energía
    - [SPY, IWM]    # grandes / pequeñas empresas

# Mercado argentino. Dólares y riesgo país vienen de api.argentinadatos.com.
local_market:
  ccl_label: CCL
  top: 3                     # cuántas suben y bajan se muestran
  dollars:
    - {casa: oficial, label: Oficial}
    - {casa: bolsa, label: MEP}
    - {casa: contadoconliqui, label: CCL}
    - {casa: blue, label: Blue}
  panel:                     # acciones del panel líder, en pesos
    - {symbol: GGAL.BA, label: Galicia}
    - {symbol: YPFD.BA, label: YPF}
    - {symbol: PAMP.BA, label: Pampa}
    - {symbol: BMA.BA, label: Macro}
    - {symbol: BBAR.BA, label: BBVA}
    - {symbol: SUPV.BA, label: Supervielle}
    - {symbol: BYMA.BA, label: BYMA}
    - {symbol: VALO.BA, label: Valores}
    - {symbol: TXAR.BA, label: Ternium}
    - {symbol: ALUA.BA, label: Aluar}
    - {symbol: CEPU.BA, label: Central Puerto}
    - {symbol: TGSU2.BA, label: TGS}
    - {symbol: TGNO4.BA, label: TGN}
    - {symbol: TRAN.BA, label: Transener}
    - {symbol: EDN.BA, label: Edenor}
    - {symbol: METR.BA, label: Metrogas}
    - {symbol: LOMA.BA, label: Loma Negra}
    - {symbol: TECO2.BA, label: Telecom}
