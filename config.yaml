# Fuentes de noticias confiables. Un titular solo se usa si su fuente o su URL
# contiene alguno de estos textos (sin importar mayúsculas).
trusted_sources:
  - reuters
  - bloomberg
  - financial times
  - ft.com
  - wsj
  - wall street journal
  - barron
  - cnbc
  - associated press
  - apnews
  - marketwatch
  - ámbito
  - ambito
  - cronista
  - lanacion
  - la nación
  - infomoney
  - valor econ

# Feeds RSS generales. Verificá que las URLs sigan vigentes: los medios las cambian seguido.
# Si un feed falla, el bot lo registra y sigue con los demás.
feeds:
  - {name: "CNBC", url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"}
  - {name: "MarketWatch", url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"}
  - {name: "Ámbito", url: "https://www.ambito.com/rss/pages/finanzas.xml"}
  - {name: "El Cronista", url: "https://www.cronista.com/files/rss/finanzas.xml"}
  - {name: "InfoMoney", url: "https://www.infomoney.com.br/feed/"}

# Resumen con IA (opcional, requiere ANTHROPIC_API_KEY)
summary:
  model: "claude-sonnet-5-5"
  max_tokens: 1500
